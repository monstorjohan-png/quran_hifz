name: quran_hifz
description: "تطبيق تحفيظ قرآن بطرق تعلم تفاعلية، صوت شيوخ، تسميع صوتي + كتابة، أوفلاين."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Storage (offline-first)
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Audio
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  flutter_tts: ^4.0.2

  # STT offline (Whisper.cpp via FFI) - placeholder package; replace with your binding
  # whisper_ggml: ^1.3.0  # optional wrapper; see services/stt_service.dart

  # Quran text & data
  quran: ^1.1.2

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2

  # Utils
  intl: ^0.20.3
  uuid: ^4.4.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/audio/
    - assets/models/
